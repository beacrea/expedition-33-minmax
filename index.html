<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expedition 33 — Build Reference</title>
<meta name="description" content="Attribute allocation, Picto/Lumina priorities, and per-character build notes for Clair Obscur: Expedition 33.">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">

<!-- iOS home-screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E33 Guide">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">

<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header>
  <h1>⚔ Expedition 33 — Build Reference</h1>
  <div class="levelbar">
    <button type="button" class="step" id="lvlDown" aria-label="Decrease level">&minus;</button>
    <input type="range" id="lvlSlider" min="1" max="99" value="12" step="1" aria-label="Character level">
    <button type="button" class="step" id="lvlUp" aria-label="Increase level">+</button>
    <span class="lvlnum"><span class="cap" aria-hidden="true">Lv</span><span id="lvlDisplay">12</span></span>
  </div>
  <nav id="tabnav" role="tablist" aria-label="Guide sections"></nav>
</header>

<p id="storageWarning" class="storage-warning" role="alert" hidden>
  This browser is refusing to save data, so your progress will not be kept.
  Private browsing is the usual cause.
</p>

<main id="mainContent"></main>

<div class="footer-note">Save to Home Screen (Safari ▸ Share ▸ Add to Home Screen) for app-like access. Progress checkboxes save locally on this device.</div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
